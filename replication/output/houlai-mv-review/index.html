<div class="wrap">
  <h1>《后来》MV — 歌曲裁剪试听</h1>
  <div class="sub">刘若英《后来》· 目标:只保留一遍歌词(主歌A两段 + 副歌1遍)· 成片 60–90s</div>

  <div class="card">
    <span class="tag">最终版(开口即"后来")</span>
    <div>源文件切点 <code>24.0s → 110.0s</code>(在候选段 A 基础上从前面再切 4 秒,单段连续)。</div>
    <audio controls preload="metadata" src="houlai-cut-final.mp3"></audio>
    <div class="meta">时长 86.0s · 第一句应为"后来"开头,请确认开口位置。</div>
  </div>

  <div class="q">
    <b>听完请告诉我(任选其一即可):</b>
    <ul>
      <li>这段直接可用 → 回「可用」;</li>
      <li>边界要挪 → 回「主歌起点早/晚 X 秒」「结尾早/晚 X 秒」;</li>
      <li>或直接给两个原曲时间点:<b>主歌"栀子花"第一句进的秒数</b> + <b>副歌"后来"第一遍唱完的秒数</b>。</li>
    </ul>
    我据此精切(免费),确认后再进分镜。
  </div>
