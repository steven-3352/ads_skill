<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 阅读</title><link rel="stylesheet" href="../../_review-assets/style.css"></head><body><main><nav><a href="index.html">返回项目首页</a></nav><h1 id="title">Markdown</h1><article id="content">加载中…</article></main><script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function md(s){let out='',inCode=false;for(const line of s.replace(/\r/g,'').split('\n')){if(line.startsWith('```')){inCode=!inCode;out+=inCode?'<pre>':'</pre>';continue}if(inCode){out+=esc(line)+'\n';continue}if(/^### /.test(line))out+='<h3>'+inline(line.slice(4))+'</h3>';else if(/^## /.test(line))out+='<h2>'+inline(line.slice(3))+'</h2>';else if(/^# /.test(line))out+='<h1>'+inline(line.slice(2))+'</h1>';else if(/^[-*] /.test(line))out+='<li>'+inline(line.slice(2))+'</li>';else if(/^\d+\. /.test(line))out+='<li>'+inline(line.replace(/^\d+\. /,''))+'</li>';else if(line.trim())out+='<p>'+inline(line)+'</p>';}return out.replace(/(<li>.*?<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');}
(async()=>{const f=new URLSearchParams(location.search).get('file');if(!f)return;const r=await fetch(f);const s=await r.text();document.title=f.split('/').pop();document.querySelector('#title').textContent=f.split('/').pop();document.querySelector('#content').innerHTML=md(s)})().catch(e=>document.querySelector('#content').textContent='无法读取文件：'+e)
</script></body></html>
